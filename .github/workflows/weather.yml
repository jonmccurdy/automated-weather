name: Emmitsburg Weather Logger

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  log_weather:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out repository with credentials
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Step 2: Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Step 3: Install required R packages
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::readr

      # Step 4: Run the weather script
      - name: Run weather script
        run: Rscript get_emmitsburg_temp.R

      # Step 5: Commit and push CSV changes
      - name: Commit updated CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m "Auto update: $(date)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
