name: Emmitsburg Weather Logger

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log_weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
      
      - name: Install R packages
        run: Rscript -e 'install.packages(c("httr", "jsonlite", "readr"))'
      
      - name: Run weather script
        run: Rscript get_emmitsburg_temp.R
      
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "Update weather data" && git push)
